<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Dashboard Owner — Permana Group</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="preload" as="style" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <style>
    :root{
      --bg:#f6f7f9;
      --card:#ffffff;
      --border:#e6e8ef;
      --ink:#0f172a;
      --ink2:#475569;
      --ink3:#8b93a7;
      --brand:#059669;
      --brand-strong:#047857;
      --brand-soft:rgba(5,150,105,.12);
      --green:#059669; --green-bg:#e9f9f2;
      --red:#dc2626;   --red-bg:#fdebec;
      --amber:#d97706; --amber-bg:#fdf3e0;
      --blue:#2563eb;  --blue-bg:#e9f0fd;
      --orange:#ea580c;--orange-bg:#fdeee4;
      --dark:#0c1526;
      --radius:14px;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;padding:0}
    body{
      font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
      background:var(--bg);
      color:var(--ink);
      font-size:15px;
      line-height:1.45;
      overflow-x:hidden;
      -webkit-text-size-adjust:100%;
      min-height:100dvh;
    }
    .tnum{font-variant-numeric:tabular-nums}
    button{font-family:inherit;cursor:pointer}

    /* ─────────────── MOBILE HEADER ─────────────── */
    .top-hero{
      background:linear-gradient(155deg,#0b1426 0%,#14203a 55%,#1b2c4d 100%);
      color:#fff;
      padding:16px 18px 22px;
      position:sticky;top:0;z-index:45;
      position:relative;overflow:hidden;
    }
    .top-hero::before{
      content:'';position:absolute;top:-70px;right:-60px;width:220px;height:220px;
      background:radial-gradient(circle,rgba(5,150,105,.35),transparent 70%);
      pointer-events:none;
    }
    .top-hero-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;position:relative;z-index:1}
    .brand-mark{
      display:flex;align-items:center;gap:9px;
    }
    .brand-logo{
      width:32px;height:32px;border-radius:9px;
      background:linear-gradient(135deg,#10b981,#059669);
      display:flex;align-items:center;justify-content:center;
      color:#fff;font-weight:800;font-size:15px;
      box-shadow:0 4px 14px rgba(5,150,105,.4);
    }
    .brand-name{font-weight:800;font-size:15px;letter-spacing:-.2px}
    .brand-sub{font-size:10.5px;color:#93a5c4;font-weight:500}
    .hero-title{font-size:20px;font-weight:800;letter-spacing:-.4px;position:relative;z-index:1}
    .hero-sub{font-size:12px;color:#93a5c4;margin-top:3px;position:relative;z-index:1}

    .btn-filter{
      display:inline-flex;align-items:center;gap:6px;
      background:rgba(255,255,255,.09);
      border:1px solid rgba(255,255,255,.16);
      color:#e7edf6;font-size:12.5px;font-weight:600;
      padding:7px 12px;border-radius:9px;
      transition:background .15s;
    }
    .btn-filter:active{background:rgba(255,255,255,.18)}
    .btn-filter i{font-size:15px}

    /* ─────────────── DESKTOP PAGE HEADER ─────────────── */
    .page-head{display:none}
    .page-head-inner{display:flex;justify-content:space-between;align-items:center;gap:16px}
    .page-head-title{display:flex;align-items:center;gap:10px}
    .page-head-title .dot{width:10px;height:10px;border-radius:3px;background:var(--brand)}
    .page-head-title h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.3px}
    .page-head-title p{margin:2px 0 0;font-size:12.5px;color:var(--ink3);font-weight:500}
    .btn-filter-solid{
      display:inline-flex;align-items:center;gap:7px;
      background:#fff;border:1px solid var(--border);
      color:var(--ink2);font-size:13px;font-weight:600;
      padding:8px 14px;border-radius:9px;
      transition:border-color .15s,box-shadow .15s;
    }
    .btn-filter-solid:hover{border-color:#c8cdd8;box-shadow:0 2px 8px rgba(15,23,42,.05)}
    .btn-filter-solid i{font-size:15px;color:var(--brand)}

    /* ─────────────── SIDEBAR (desktop only) ─────────────── */
    .sidebar{display:none}
    .sidebar .brand-logo{width:36px;height:36px;border-radius:10px;font-size:17px}
    .sidebar .brand-name{font-size:16px}
    .side-nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
    .side-label{font-size:10px;font-weight:600;letter-spacing:1.2px;color:#5d7190;text-transform:uppercase;margin:22px 14px 8px}
    .side-btn{
      display:flex;align-items:center;gap:12px;width:100%;
      background:none;border:none;color:#a7b6d0;
      font-size:14px;font-weight:500;text-align:left;
      padding:10px 14px;border-radius:9px;
      transition:background .15s,color .15s;
      position:relative;
    }
    .side-btn i{font-size:19px;width:22px;text-align:center}
    .side-btn:hover{background:rgba(255,255,255,.05);color:#e7edf6}
    .side-btn.active{background:var(--brand-soft);color:#34d399;font-weight:600}
    .side-btn.active::before{
      content:'';position:absolute;left:-18px;top:50%;transform:translateY(-50%);
      width:3px;height:22px;border-radius:0 3px 3px 0;background:#10b981;
    }
    .side-period{
      margin-top:auto;background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
      border-radius:12px;padding:13px 14px;
    }
    .side-period .sp-label{font-size:10px;font-weight:600;letter-spacing:1px;color:#5d7190;text-transform:uppercase}
    .side-period .sp-value{font-size:13px;font-weight:600;color:#e7edf6;margin-top:4px;display:flex;align-items:center;gap:8px}
    .side-period .sp-edit{
      margin-left:auto;background:none;border:none;color:#34d399;
      display:flex;align-items:center;padding:2px;
    }
    .side-period .sp-edit:hover{color:#6ee7b7}

    /* ─────────────── PAGES ─────────────── */
    .page{display:none;padding:16px 18px 36px;animation:fadeIn .25s ease}
    body{padding-bottom:86px}
    .page.active{display:block}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

    /* ─────────────── CARDS ─────────────── */
    .card{
      background:var(--card);border:1px solid var(--border);
      border-radius:var(--radius);padding:16px;
      box-shadow:0 1px 2px rgba(15,23,42,.03);
    }
    .card.click{transition:transform .12s,box-shadow .12s;cursor:pointer}
    .card.click:active{transform:scale(.985)}
    .card-title{font-size:13px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:7px;margin-bottom:4px}
    .card-title i{color:var(--brand)}

    .sec-label{
      font-size:10.5px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;
      color:var(--ink3);padding:0 2px;margin:22px 0 10px;
    }

    /* Hero profit */
    .hero{
      position:relative;overflow:hidden;
      background:linear-gradient(145deg,#0c1526 0%,#13203c 60%,#1a2b4d 100%);
      border-radius:16px;padding:20px;color:#fff;
      box-shadow:0 6px 24px rgba(12,21,38,.18);
    }
    .hero::before{
      content:'';position:absolute;top:-60px;left:-40px;width:200px;height:200px;
      background:radial-gradient(circle,rgba(16,185,129,.28),transparent 70%);pointer-events:none;
    }
    .hero .h-label{font-size:11.5px;font-weight:600;color:#93a5c4;letter-spacing:.4px}
    .hero .h-value{font-size:26px;font-weight:800;letter-spacing:-.6px;margin-top:5px}
    .hero .h-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;position:relative;z-index:1}
    .hero .h-tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:8px}
    .hero .h-margin{margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:#93a5c4}
    .hero i.hero-deco{position:absolute;top:16px;right:16px;font-size:26px;color:rgba(255,255,255,.09)}
    .pos{color:#34d399}.neg{color:#fda4af}

    /* Metric cards */
    .m-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    .metric{
      background:#fff;border:1px solid var(--border);border-radius:var(--radius);
      padding:14px;cursor:pointer;position:relative;
      transition:transform .12s,border-color .12s,box-shadow .12s;
    }
    .metric:hover{border-color:#cfd4dd;box-shadow:0 3px 12px rgba(15,23,42,.05)}
    .metric:active{transform:scale(.97)}
    .m-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;margin-bottom:10px}
    .m-label{font-size:10.5px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px}
    .m-value{font-size:17px;font-weight:800;letter-spacing:-.3px;margin-top:3px}
    .m-sub{font-size:11px;color:var(--ink3);margin-top:2px}

    .t-green{color:var(--green)}.t-red{color:var(--red)}.t-amber{color:var(--amber)}.t-blue{color:var(--blue)}.t-orange{color:var(--orange)}
    .bg-tint-green{background:var(--green-bg);color:var(--green)}
    .bg-tint-red{background:var(--red-bg);color:var(--red)}
    .bg-tint-amber{background:var(--amber-bg);color:var(--amber)}
    .bg-tint-blue{background:var(--blue-bg);color:var(--blue)}
    .bg-tint-orange{background:var(--orange-bg);color:var(--orange)}

    /* Lists */
    .list{display:flex;flex-direction:column}
    .list-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #eef0f5}
    .list-row:last-child{border-bottom:none}
    .lr-title{font-size:13.5px;font-weight:600;color:var(--ink)}
    .lr-sub{font-size:11.5px;color:var(--ink3);margin-top:1px}
    .lr-amount{font-size:13.5px;font-weight:700}
    .pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:8px;font-size:11px;font-weight:700}
    .row-click{cursor:pointer;border-radius:6px;padding-left:6px;padding-right:6px;transition:background .12s}
    .row-click:hover{background:#f8fafc}
    .chev{color:#cdd3dd;font-size:13px;margin-left:2px}

    /* Summary strip (stok) */
    .sum-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .sum-cell{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center}
    .sum-cell .s-label{font-size:10px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px}
    .sum-cell .s-value{font-size:16px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}

    /* P/L tiles */
    .pl-tile{border-radius:var(--radius);padding:14px;border:1px solid var(--border);background:#fff}
    .pl-tile .t-label{font-size:10.5px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px}
    .pl-tile .t-value{font-size:18px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}

    /* ─────────────── NAV (mobile bottom) ─────────────── */
    .bottom-nav{
      position:fixed;bottom:0;left:0;right:0;z-index:50;
      display:flex;justify-content:space-around;align-items:center;
      background:rgba(255,255,255,.9);
      backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
      border-top:1px solid rgba(0,0,0,.06);
      padding:6px 8px calc(6px + env(safe-area-inset-bottom));
    }
    .nav-btn{
      display:flex;flex-direction:column;align-items:center;gap:3px;
      background:none;border:none;padding:6px 14px;border-radius:10px;
      font-size:10.5px;font-weight:600;color:var(--ink3);
      transition:color .15s,transform .1s;
    }
    .nav-btn i{font-size:21px} 
    .nav-btn:active{transform:scale(.92)}
    .nav-btn.active{color:var(--brand)}
    .nav-btn.active i{color:var(--brand)}

    /* ─────────────── MODALS ─────────────── */
    .overlay{position:fixed;inset:0;z-index:200;display:none;background:rgba(12,21,38,.45);backdrop-filter:blur(3px)}
    .overlay.open{display:block}
    .sheet{
      position:fixed;bottom:0;left:0;right:0;z-index:201;margin:0 auto;
      background:#fff;border-radius:20px 20px 0 0;max-height:82dvh;overflow-y:auto;
      padding:12px 18px 30px;
      box-shadow:0 -10px 40px rgba(12,21,38,.18);
      animation:sheetUp .28s cubic-bezier(.16,1,.3,1);
    }
    @keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .sheet .handle{width:38px;height:4px;background:#d6dae2;border-radius:2px;margin:0 auto 16px}
    .sheet-title{font-size:16px;font-weight:800;letter-spacing:-.2px;margin:0 0 16px}
    .sheet-close{position:absolute;top:14px;right:14px;background:var(--bg);border:none;border-radius:8px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:15px}

    .chip{padding:7px 14px;border-radius:9px;font-size:12.5px;font-weight:600;background:var(--bg);color:var(--ink2);border:none;transition:background .15s,color .15s;transform:translateZ(0)}
    .chip:active{transform:scale(.96)}
    .chip.active{background:var(--ink);color:#fff}

    .btn-primary{
      background:var(--brand);color:#fff;border:none;border-radius:10px;
      padding:12px;font-size:14px;font-weight:700;
      transition:transform .1s,background .15s;
    }
    .btn-primary:active{transform:scale(.98)}
    .btn-primary:hover{background:var(--brand-strong)}
    .btn-ghost{background:var(--bg);color:var(--ink2);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:14px;font-weight:600}
    .btn-ghost:active{transform:scale(.98)}
    input[type="date"]{
      font-family:inherit;font-size:13px;color:var(--ink);background:#fff;
      border:1.5px solid var(--border);border-radius:10px;padding:9px 10px;width:100%;outline:none;
      transition:border-color .15s;
    }
    input[type="date"]:focus{border-color:var(--brand)}
    .field-label{font-size:11.5px;font-weight:600;color:var(--ink2);display:block;margin-bottom:5px}

    /* ─────────────── TOAST / SKELETON / SPINNER ─────────────── */
    .toast{
      position:fixed;top:16px;left:50%;z-index:300;
      transform:translate(-50%,-16px);opacity:0;
      background:#0c1526;color:#fff;padding:11px 18px;border-radius:11px;
      font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(12,21,38,.3);
      transition:opacity .25s,transform .25s;pointer-events:none;
    }
    .toast.show{opacity:1;transform:translate(-50%,0)}
    .spinner{width:26px;height:26px;border:3px solid #e3e7ee;border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;margin:40px auto}
    @keyframes spin{to{transform:rotate(360deg)}}
    .load-wrap{text-align:center;padding:24px 0}
    .load-note{font-size:12px;color:var(--ink3);margin-top:-26px;text-align:center}

    .sk{background:linear-gradient(90deg,#eef1f6 25%,#e3e8f0 50%,#eef1f6 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:10px}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .sk-hero{height:118px;border-radius:16px}
    .sk-metric{height:96px}
    .sk-card{height:120px}
    .sk-row{height:48px;margin-bottom:8px;border-radius:8px}
    .sk-gap{margin-top:12px}

    .empty{text-align:center;padding:28px 16px;color:var(--ink3)}
    .empty i{font-size:30px;opacity:.4;display:block;margin-bottom:8px}
    .empty p{font-size:13px;margin:0}

    .error-box{display:flex;align-items:center;gap:10px;color:var(--red);font-size:13.5px;font-weight:600}
    .error-box i{font-size:22px}

    /* ─────────────── RESPONSIVE ─────────────── */
@media (min-width:1024px){
      .sidebar{display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;width:264px;background:linear-gradient(180deg,#0c1526,#16213a);padding:24px 18px 20px;z-index:60;overflow-y:auto;color:#fff}
      .main-wrap{margin-left:264px}
      .top-hero{display:none}
      .page-head{display:block;background:#fff;border-bottom:1px solid var(--border);padding:18px 36px;position:sticky;top:0;z-index:40}
      .page{padding:28px 36px 60px}
      body{padding-bottom:0}
      .m-grid.desktop-4{grid-template-columns:repeat(4,1fr);gap:14px}
      .m-grid.desktop-2{grid-template-columns:repeat(2,1fr);gap:14px}
      .m-grid.desktop-3{grid-template-columns:repeat(3,1fr);gap:14px}
      .m-value{font-size:19px}
      .hero{padding:24px}
      .hero .h-value{font-size:30px}
      .bottom-nav{display:none}
      .sheet{bottom:auto;top:50%;left:50%;right:auto;transform:translate(-50%,-50%);max-width:430px;width:88%;max-height:86dvh;border-radius:18px;animation:sheetCenter .28s cubic-bezier(.16,1,.3,1)}
      @keyframes sheetCenter{from{opacity:0;transform:translate(-50%,-46%)}to{opacity:1;transform:translate(-50%,-50%)}}
      .sheet .handle{display:none}
    }
  </style>
</head>
<body>

<!-- ============ SIDEBAR (DESKTOP) ============ -->
<aside class="sidebar">
  <div class="brand-mark" style="padding:0 8px;margin-bottom:8px">
    <div class="brand-logo">P</div>
    <div>
      <div class="brand-name">Permana Group</div>
      <div class="brand-sub">Owner Dashboard</div>
    </div>
  </div>

  <nav class="side-nav">
    <p class="side-label">Utama</p>
    <button class="side-btn active" data-page="overview" onclick="navigate('overview')"><i class="ph-fill ph-gauge"></i> Dashboard</button>
    <button class="side-btn" data-page="piutang" onclick="navigate('piutang')"><i class="ph-fill ph-coins"></i> Piutang</button>
    <button class="side-btn" data-page="hutang" onclick="navigate('hutang')"><i class="ph-fill ph-receipt"></i> Hutang</button>
    <p class="side-label" style="display:none"></p>
    <button class="side-btn" data-page="stok" onclick="navigate('stok')"><i class="ph-fill ph-box"></i> Stok</button>
    <button class="side-btn" data-page="kas" onclick="navigate('kas')"><i class="ph-fill ph-bank"></i> Kas &amp; Bank</button>
    <button class="side-btn" data-page="laporan" onclick="navigate('laporan')"><i class="ph-fill ph-chart-line"></i> Laporan</button>
  </nav>

  <div class="side-period">
    <p class="sp-label">Periode Aktif</p>
    <div class="sp-value">
      <span id="sidePeriod">Bulan Ini</span>
      <button class="sp-edit" onclick="showFilterModal()"><i class="ph-fill ph-pencil-simple"></i></button>
    </div>
  </div>
</aside>

<!-- ============ MAIN ============ -->
<div class="main-wrap">

  <!-- MOBILE HEADER -->
  <header class="top-hero">
    <div class="top-hero-row">
      <div class="brand-mark">
        <div class="brand-logo">P</div>
        <div>
          <div class="brand-name">Permana Group</div>
          <div class="brand-sub">Owner Dashboard</div>
        </div>
      </div>
      <button class="btn-filter" onclick="showFilterModal()"><i class="ph-fill ph-sliders-horizontal"></i> Filter</button>
    </div>
    <h1 class="hero-title" id="pageTitle">Dashboard</h1>
    <p class="hero-sub" id="pageSubtitle">Periode: Bulan Ini</p>
  </header>

  <!-- DESKTOP HEADER -->
  <header class="page-head">
    <div class="page-head-inner" style="max-width:1200px;margin:0 auto">
      <div class="page-head-title">
        <span class="dot"></span>
        <div>
          <h1 id="pageTitleD">Dashboard</h1>
          <p id="pageSubtitleD">Periode Bulan Ini</p>
        </div>
      </div>
      <button class="btn-filter-solid" onclick="showFilterModal()"><i class="ph-fill ph-sliders-horizontal"></i> Filter Periode</button>
    </div>
  </header>

  <!-- ============ PAGE: OVERVIEW ============ -->
  <div id="page-overview" class="page active">
    <div id="overviewContent"><div class="load-wrap"><div class="spinner"></div></div><p class="load-note">Memuat data…</p></div>
  </div>

  <!-- ============ PAGE: PIUTANG ============ -->
  <div id="page-piutang" class="page">
    <div id="piutangContent"><div class="spinner"></div></div>
  </div>

  <!-- ============ PAGE: HUTANG ============ -->
  <div id="page-hutang" class="page">
    <div id="hutangContent"><div class="spinner"></div></div>
  </div>

  <!-- ============ PAGE: STOK ============ -->
  <div id="page-stok" class="page">
    <div id="stokContent"><div class="spinner"></div></div>
  </div>

  <!-- ============ PAGE: KAS ============ -->
  <div id="page-kas" class="page">
    <div id="kasContent"><div class="spinner"></div></div>
  </div>

  <!-- ============ PAGE: LAPORAN ============ -->
  <div id="page-laporan" class="page">

<script>
// ==========================================
// CONFIG
// ==========================================
const API_URL = window.location.href.includes('script.googleusercontent')
  ? window.location.href.split('?')[0]
  : 'https://script.google.com/macros/s/AKfycbwQ99okiwVZRMulu4DnBlZK689Ku5449NkhtdZcMnYxtgRVyFUY4vMfJHqRjVjj4AaOIg/exec';

let currentFilter = { start: null, end: null };
let currentPageName = 'overview';
let cache = {};
let forceRefreshFlag = false;

// ==========================================
// HELPERS
// ==========================================
function fmtIDR(n) {
  return 'Rp ' + Number(n || 0).toLocaleString('id-ID');
}
function fmtCompact(n) {
  const abs = Math.abs(n);
  if (abs >= 1e9) return (n / 1e9).toFixed(1) + 'M';
  if (abs >= 1e6) return (n / 1e6).toFixed(1) + 'jt';
  if (abs >= 1e3) return (n / 1e3).toFixed(0) + 'rb';
  return String(n);
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

async function apiCall(action, params = {}) {
  const url = new URL(API_URL);
  url.searchParams.set('action', action);
  if (params.start) url.searchParams.set('start', params.start);
  if (params.end) url.searchParams.set('end', params.end);
  if (params.sub) url.searchParams.set('sub', params.sub);
  if (params.refresh) url.searchParams.set('refresh', '1');
  try {
    const res = await fetch(url.toString());
    return await res.json();
  } catch (e) {
    console.error('API error:', e);
    return { error: e.message };
  }
}

async function fetchPage(cacheKey, action, extraParams = {}) {
  const refresh = forceRefreshFlag;
  forceRefreshFlag = false;
  if (!refresh && cache[cacheKey]) return cache[cacheKey];
  const params = { ...currentFilter, ...extraParams };
  if (refresh) params.refresh = '1';
  const data = await apiCall(action, params);
  if (!data.error) cache[cacheKey] = data;
  return data;
}

// ==========================================
// PREFETCH + STALE-WHILE-REVALIDATE
// ==========================================
function prefetchPage(page) {
  const key = page === 'laporan' ? 'report' : page;
  if (cache[key]) return;
  apiCall(page === 'laporan' ? 'report' : page, currentFilter).then(d => { if (!d.error) cache[key] = d; }).catch(() => {});
}
function backgroundRefresh(cacheKey, action, renderFn) {
  apiCall(action, { ...currentFilter, refresh: '1' }).then(data => {
    if (!data.error) {
      cache[cacheKey] = data;
      const activeKey = currentPageName === 'laporan' ? 'report' : currentPageName;
      if (activeKey === cacheKey) renderFn(data);
    }
  }).catch(() => {});
}

// ==========================================
// NAVIGATION
// ==========================================
function updateHeader(title, subtitle) {
  const m = document.getElementById('pageTitle'), ms = document.getElementById('pageSubtitle');
  const d = document.getElementById('pageTitleD'), ds = document.getElementById('pageSubtitleD');
  if (m) m.textContent = title;
  if (ms) ms.textContent = 'Periode: ' + subtitle;
  if (d) d.textContent = title;
  if (ds) ds.textContent = subtitle;
  const sp = document.getElementById('sidePeriod');
  if (sp) sp.textContent = subtitle;
}

function navigate(page) {
  currentPageName = page;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.querySelectorAll('.nav-btn, .side-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll(`.nav-btn[data-page="${page}"], .side-btn[data-page="${page}"]`).forEach(b => b.classList.add('active'));

  const titles = {
    overview: ['Dashboard', getCurrentPeriodLabel()],
    piutang: ['Piutang', 'Total tagihan yang belum dibayar pelanggan'],
    hutang: ['Hutang', 'Total kewajiban kepada supplier & pabrik'],
    stok: ['Stok & Persediaan', 'Nilai persediaan saat ini'],
    kas: ['Kas & Bank', 'Saldo seluruh akun kas'],
    laporan: ['Laporan Laba Rugi', 'Periode: ' + getCurrentPeriodLabel()]
  };
  const t = titles[page] || titles.overview;
  updateHeader(t[0], t[1]);

  if (page === 'overview') loadOverview();
  if (page === 'piutang') loadPiutangDetail();
  if (page === 'hutang') loadHutangDetail();
  if (page === 'stok') loadStokDetail();
  if (page === 'kas') loadKasDetail();
  if (page === 'laporan') loadPL();
}

// ==========================================
// FILTER
// ==========================================
function showFilterModal() {
  document.getElementById('filterModal').classList.add('open');
}
function hideFilterModal() {
  document.getElementById('filterModal').classList.remove('open');
}
function setQuickFilter(type, btn) {
  const now = new Date();
  let start, end;
  if (type === 'today') {
    const d = now.toISOString().split('T')[0];
    start = end = d;
  } else if (type === 'week') {
    const day = now.getDay() || 7;
    const monday = new Date(now); monday.setDate(now.getDate() - day + 1);
    const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
    start = monday.toISOString().split('T')[0];
    end = sunday.toISOString().split('T')[0];
  } else if (type === 'month') {
    start = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
    end = new Date(now.getFullYear(), now.getMonth() + 1, 0).toISOString().split('T')[0];
  } else if (type === 'year') {
    start = `${now.getFullYear()}-01-01`;
    end = `${now.getFullYear()}-12-31`;
  } else {
    start = null; end = null;
  }
  document.getElementById('filterStart').value = start || '';
  document.getElementById('filterEnd').value = end || '';
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
}
function applyFilter() {
  currentFilter.start = document.getElementById('filterStart').value || null;
  currentFilter.end = document.getElementById('filterEnd').value || null;
  cache = {};
  hideFilterModal();
  toast('Filter: ' + getCurrentPeriodLabel());
  navigate('overview');
}
function getCurrentPeriodLabel() {
  if (!currentFilter.start && !currentFilter.end) return 'Semua Waktu';
  if (currentFilter.start === currentFilter.end) return currentFilter.start;
  return `${currentFilter.start || 'Awal'} s/d ${currentFilter.end || 'Sekarang'}`;
}

async function loadOverview() {
  const container = document.getElementById('overviewContent');
  if (!forceRefreshFlag && cache.overview) {
    renderOverview(cache.overview);
    setTimeout(() => ['piutang', 'hutang', 'laporan'].forEach(prefetchPage), 1500);

  }
  container.innerHTML = skeletonOverview();

    container.innerHTML = `
      <div class="card">
        <div class="error-box"><i class="ph-fill ph-warning-circle"></i> Gagal memuat data: ${data.error}</div>

  renderOverview(data);
  setTimeout(() => ['piutang', 'hutang', 'laporan'].forEach(prefetchPage), 1500);
}

async function loadPiutangDetail() {
  const c = document.getElementById('piutangContent');
  if (!forceRefreshFlag && cache.piutang) {
    renderPiutang(cache.piutang);
    backgroundRefresh('piutang', 'piutang', renderPiutang);
    return;
  }
  c.innerHTML = '<div class="spinner"></div>';
  const data = await fetchPage('piutang', 'piutang');
  if (data.error) { c.innerHTML = `<div class="card"><div class="error-box"><i class="ph-fill ph-warning-circle"></i> ${data.error}</div></div>`; return; }
  renderPiutang(data);
}

function renderPiutang(data) {
  const c = document.getElementById('piutangContent');
  const total = (data.broker?.total||0) + (data.sales?.total||0) + (data.pos?.total||0);
  let html = `
    <div class="hero">
      <i class="ph-fill ph-coins hero-deco"></i>
      <p class="h-label">TOTAL PIUTANG</p>
      <p class="h-value tnum pos">${fmtIDR(total)}</p>
    </div>
  `;

  const sections = [
    { title: 'Broker (Buyer)', data: data.broker, amountKey: 'remaining', nameKey: 'name', subKey: 'code' },
    { title: 'Sales Customer', data: data.sales, amountKey: 'piutang', nameKey: 'name', subKey: 'phone' },
    { title: 'POS / Ecer', data: data.pos, amountKey: 'piutang', nameKey: 'name', subKey: 'phone' }
  ];

  sections.forEach(sec => {
    if (!sec.data || !sec.data.list || sec.data.list.length === 0) return;
    html += `

          <span class="pill bg-tint-green">${sec.data.count} · ${fmtIDR(sec.data.total)}</span>
        </div>
        <div class="list">
        ${sec.data.list.slice(0, 20).map(item => `
          <div class="list-row">
            <div class="flex-1">

              <p class="lr-sub">${item[sec.subKey] || ''} ${item.salesName ? ' · Sales: '+item.salesName : ''}</p>

        `).join('')}

  });

  c.innerHTML = html;
}

  sections.forEach(sec => {
    if (!sec.data || !sec.data.list || sec.data.list.length === 0) return;
    html += `
      <div class="card" style="margin-top:14px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <p class="lr-title">${sec.title}</p>
          <span class="pill bg-tint-red">${sec.data.count} · ${fmtIDR(sec.data.total)}</span>
        </div>
        <div class="list">
        ${sec.data.list.slice(0, 20).map(item => `
          <div class="list-row">
            <div class="flex-1">
              <p class="lr-title">${item.name || '-'}</p>
              ${item.code ? `<p class="lr-sub">${item.code}</p>` : ''}
              ${item.orders ? `<p class="lr-sub">${item.orders} order · Total: ${fmtIDR(item.total)}</p>` : ''}
            </div>
            <div style="text-align:right">
              <p class="lr-amount tnum t-red">${fmtIDR(item[sec.amountKey])}</p>
              ${item.paid ? `<p class="lr-sub">Bayar: ${fmtIDR(item.paid)}</p>` : ''}
            </div>
          </div>
        `).join('')}
        ${sec.data.list.length > 20 ? `<p style="text-align:center;font-size:12px;color:var(--ink3);padding-top:10px">+${sec.data.list.length - 20} lainnya</p>` : ''}
        </div>
      </div>
    `;
  });

  c.innerHTML = html;
}

// ==========================================
// STOK DETAIL
// ==========================================
async function loadStokDetail() {
  const c = document.getElementById('stokContent');
  if (!forceRefreshFlag && cache.stok) {
    renderStok(cache.stok);
    backgroundRefresh('stok', 'stok', renderStok);
    return;
  }
  c.innerHTML = '<div class="spinner"></div>';
  const data = await fetchPage('stok', 'stok');
  if (data.error) { c.innerHTML = `<div class="card"><div class="error-box"><i class="ph-fill ph-warning-circle"></i> ${data.error}</div></div>`; return; }
  renderStok(data);
}

function renderStok(data) {
  const c = document.getElementById('stokContent');
  let html = `
    <div class="sum-strip">
      <div class="sum-cell"><p class="s-label">Total Nilai</p><p class="s-value t-orange">${fmtCompact(data.totalValue)}</p></div>
      <div class="sum-cell"><p class="s-label">Total Qty</p><p class="s-value">${data.totalQty.toLocaleString('id-ID')}</p></div>
      <div class="sum-cell"><p class="s-label">Item Kosong</p><p class="s-value t-red">${data.lowStock}</p></div>
    </div>
  `;

  if (data.list && data.list.length > 0) {
    html += `<div class="card" style="margin-top:14px">
      <p class="card-title"><i class="ph-fill ph-box"></i> Top 20 Stok (by Value)</p>
      <div class="list">
        ${data.list.slice(0, 20).map(item => `
          <div class="list-row">
            <div class="flex-1">
              <p class="lr-title">${item.name}</p>
              <p class="lr-sub">${item.code} · HPP: ${fmtIDR(item.hpp)}</p>
            </div>
            <div style="text-align:right">
              <p class="lr-title tnum ${item.stock <= 0 ? 't-red' : ''}">${item.stock} unit</p>
              <p class="lr-sub">${fmtIDR(item.value)}</p>
            </div>
          </div>
        `).join('')}
      </div>
    </div>`;
  } else {
    html += `<div class="empty"><i class="ph-fill ph-box"></i><p>Belum ada data stok.</p></div>`;
  }
  c.innerHTML = html;
}

// KAS DETAIL

function renderKas(data) {

    </div>
    <div class="card" style="margin-top:14px">

// ==========================================
// PROFIT/LOSS + TREND CHART
// ==========================================
let trendChartInstance = null;
async function loadPL() {
  const c = document.getElementById('plContent');
  if (!forceRefreshFlag && cache.report) {
    renderPL(cache.report);
    backgroundRefresh('report', 'report', renderPL);
    return;
  }
  c.innerHTML = '<div class="spinner"></div>';
  const data = await fetchPage('report', 'report');
  if (data.pl && data.pl.error) { c.innerHTML = `<div class="card"><div class="error-box"><i class="ph-fill ph-warning-circle"></i> ${data.pl.error}</div></div>`; return; }
  renderPL(data);
}

function renderPL(data) {
  const c = document.getElementById('plContent');
  const pl = data.pl;
  const trend = data.trend;
  const profitCls = pl.profit >= 0 ? 'pos' : 'neg';

  c.innerHTML = `
    <div class="hero">
      <i class="ph-fill ph-chart-line hero-deco"></i>
      <p class="h-label">LABA BERSIH — PERIODE</p>
      <p class="h-value tnum ${profitCls}">${fmtIDR(pl.profit)}</p>
      ${pl.margin !== undefined ? `<p class="h-margin">Margin profit: <b class="${profitCls}">${pl.margin.toFixed(2)}%</b></p>` : ''}
    </div>
    ${pl.segments ? `
    <div class="m-grid desktop-2" style="margin-top:14px">
      <div class="pl-tile">
        <p class="t-label">Laba Kotor · Penjualan Langsung</p>
        <p class="t-value tnum ${pl.segments.direct.revenue - pl.segments.direct.costs >= 0 ? 't-green' : 't-red'}">${fmtIDR(pl.segments.direct.revenue - pl.segments.direct.costs)}</p>
        <p style="font-size:11.5px;color:var(--ink3);margin-top:4px">Rev ${fmtIDR(pl.segments.direct.revenue)} · HPP ${fmtIDR(pl.segments.direct.costs)}</p>
      </div>
      <div class="pl-tile">
        <p class="t-label">Laba Kotor · Broker</p>
        <p class="t-value tnum ${pl.segments.broker.revenue - pl.segments.broker.costs >= 0 ? 't-blue' : 't-red'}">${fmtIDR(pl.segments.broker.revenue - pl.segments.broker.costs)}</p>
        <p style="font-size:11.5px;color:var(--ink3);margin-top:4px">Fee ${fmtIDR(pl.segments.broker.revenue)} · Beban ${fmtIDR(pl.segments.broker.costs)}</p>
      </div>
    </div>
    <div class="card" style="margin-top:10px;padding:12px 16px">
      <div class="list-row" style="padding:6px 0">
        <span style="font-size:12.5px;color:var(--ink2);font-weight:600">Beban operasional</span>
        <span class="tnum" style="font-size:13px;font-weight:700;color:var(--red)">− ${fmtIDR(pl.segments.overhead)}</span>
      </div>
      ${pl.segments.otherRevenue > 0 ? `
      <div class="list-row" style="padding:6px 0">
        <span style="font-size:12.5px;color:var(--ink2);font-weight:600">Pendapatan lain</span>
        <span class="tnum" style="font-size:13px;font-weight:700;color:var(--green)">+ ${fmtIDR(pl.segments.otherRevenue)}</span>
      </div>` : ''}
      <div class="list-row" style="padding:8px 0 2px">
        <span style="font-size:12.5px;color:var(--ink);font-weight:700">Laba bersih</span>
        <span class="tnum" style="font-size:14px;font-weight:800;color:${pl.profit >= 0 ? 'var(--green)' : 'var(--red)'}">${fmtIDR(pl.profit)}</span>
      </div>
    </div>
    ` : ''}
    <div class="m-grid desktop-2" style="margin-top:14px">
      <div class="pl-tile">
        <p class="t-label">Revenue</p>
        <p class="t-value tnum t-green">${fmtCompact(pl.revenue)}</p>
      </div>
      <div class="pl-tile">
        <p class="t-label">Beban</p>
        <p class="t-value tnum t-red">${fmtCompact(pl.expense)}</p>
      </div>
      <div class="pl-tile" style="grid-column:1 / -1">
        <p class="t-label">HPP (COGS)</p>
        <p class="t-value tnum" style="color:var(--ink)">${fmtIDR(pl.cogs !== undefined ? pl.cogs : '-')}</p>
      </div>
    </div>
    ${pl.topRevenue && pl.topRevenue.length ? `
      <p class="sec-label">Sumber Pendapatan</p>
      <div class="card">
        <div class="list">
          ${pl.topRevenue.map(r => `<div class="list-row"><p class="lr-title">${r.name}</p><p class="lr-amount tnum t-green">${fmtIDR(r.amount)}</p></div>`).join('')}
        </div>
      </div>
    ` : ''}
    ${pl.topExpense && pl.topExpense.length ? `
      <p class="sec-label">Beban Terbesar</p>
      <div class="card">
        <div class="list">
          ${pl.topExpense.map(r => `<div class="list-row"><p class="lr-title">${r.name}</p><p class="lr-amount tnum t-red">${fmtIDR(r.amount)}</p></div>`).join('')}
        </div>
      </div>
    ` : ''}
  `;

  if (trend && trend.labels && trend.labels.length > 0) {
    const ctx = document.getElementById('trendChart').getContext('2d');
    if (trendChartInstance) trendChartInstance.destroy();
    trendChartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: trend.labels.map(l => {
          const p = l.split('-');
          return trend.isMonthly ? `${['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][parseInt(p[1])-1]} ${p[0]}` : `${p[2]}/${p[1]}`;
        }),
        datasets: [
          { label: 'Revenue', data: trend.revenue, borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,.08)', tension: .4, fill: true, pointRadius: 3, pointBackgroundColor: '#10b981', borderWidth: 2 },
          { label: 'Beban', data: trend.expense, borderColor: '#f43f5e', backgroundColor: 'rgba(244,63,94,.08)', tension: .4, fill: true, pointRadius: 3, pointBackgroundColor: '#f43f5e', borderWidth: 2 },
          { label: 'Laba', data: trend.profit, borderColor: '#0ea5e9', backgroundColor: 'rgba(14,165,233,.08)', tension: .4, fill: true, pointRadius: 3, pointBackgroundColor: '#0ea5e9', borderWidth: 2 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11, family: "'Plus Jakarta Sans'" }, padding: 14, usePointStyle: true, color: '#64748b' } }
        },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 10, family: "'Plus Jakarta Sans'" }, maxRotation: 45, color: '#8b93a7' } },
          y: { grid: { color: '#eef0f5' }, ticks: { font: { size: 10, family: "'Plus Jakarta Sans'" }, callback: v => fmtCompact(v), color: '#8b93a7' } }
        }
      }
    });
  }
}

// ==========================================
// MODAL HELPERS
// ==========================================
function showDetailModal(title, contentHtml) {
  document.getElementById('detailModalContent').innerHTML = `<h3 class="sheet-title">${title}</h3>${contentHtml}`;
  document.getElementById('detailModal').classList.add('open');
}
function closeDetailModal() {
  document.getElementById('detailModal').classList.remove('open');
}

async function showDepositDetail() {
  showDetailModal('Detail Deposit Supplier', '<div class="spinner"></div>');
  const data = cache.deposit || await (async () => { const r = await apiCall('deposit'); if (!r.error) cache.deposit = r; return r; })();
  if (data.error) { showDetailModal('Detail Deposit', `<p style="color:var(--red)">${data.error}</p>`); return; }

  let html = `<p style="font-size:13px;color:var(--ink2);margin:0 0 4px"><span style="font-weight:700;color:var(--ink)">${fmtIDR(data.total)}</span> · ${data.count} supplier</p><div class="list">`;
  (data.list || []).slice(0, 30).forEach(d => {
    html += `<div class="list-row">
      <div><p class="lr-title">${d.name}</p><p class="lr-sub">${d.code}</p></div>
      <p class="lr-amount tnum" style="color:${d.balance < 0 ? 'var(--red)' : 'var(--green)'}">${fmtIDR(d.balance)}</p>
    </div>`;
  });
  html += `</div>`;
  showDetailModal('Detail Deposit Supplier', html);
}

async function showKontrakDetail() {
  showDetailModal('Detail Kontrak Jaminan', '<div class="spinner"></div>');
  const data = cache.kontrak || await (async () => { const r = await apiCall('kontrak'); if (!r.error) cache.kontrak = r; return r; })();
  if (data.error) { showDetailModal('Detail Kontrak', `<p style="color:var(--red)">${data.error}</p>`); return; }

  let html = `<p style="font-size:13px;color:var(--ink2);margin:0 0 4px"><span style="font-weight:700;color:var(--ink)">${fmtIDR(data.total)}</span> · ${data.count} kontrak · ${data.nearMaturity} jatuh tempo ≤ 7 hari</p><div class="list">`;
  (data.list || []).slice(0, 30).forEach(k => {
    html += `<div class="list-row">
      <div class="flex-1">
        <p class="lr-title">${k.supplierName}</p>
        <p class="lr-sub">${k.category} · ${k.code}</p>
        ${k.dueDate
          ? `<p class="lr-sub" style="color:${k.nearMaturity ? 'var(--red)' : 'var(--ink3)'};${k.nearMaturity ? 'font-weight:700' : ''}">Jatuh tempo: ${k.dueDate}</p>`
          : '<p class="lr-sub">Unlimited</p>'}
      </div>
      <p class="lr-amount tnum" style="color:var(--ink)">${fmtIDR(k.nominal)}</p>
    </div>`;
  });
  html += `</div>`;
  showDetailModal('Detail Kontrak Jaminan', html);
}

async function showPiutangSub(sub) {
  showDetailModal('Rincian Piutang', '<div class="spinner"></div>');
  const data = await apiCall('piutang', {...currentFilter, sub});
  const labelMap = { broker: 'Broker (Buyer)', sales: 'Sales Customer', pos: 'POS / Ecer' };
  let html = `<p style="font-size:13px;color:var(--ink2);margin:0 0 4px">${labelMap[sub] || ''}</p><div class="list">`;
  const sec = data;
  if (sec && sec.list) {
    sec.list.slice(0, 30).forEach(item => {
      const amt = sub === 'broker' ? item.remaining : item.piutang;
      html += `<div class="list-row">
        <div><p class="lr-title">${item.name || '-'}</p><p class="lr-sub">${item.code || item.phone || ''}</p></div>
        <p class="lr-amount tnum t-red">${fmtIDR(amt)}</p>
      </div>`;
    });
  }
  html += `</div>`;
  showDetailModal('Rincian Piutang', html);
}

async function showHutangSub(sub) {
  showDetailModal('Rincian Hutang', '<div class="spinner"></div>');
  const data = await apiCall('hutang', {...currentFilter, sub});
  const labelMap = { broker: 'Broker (Pabrik)', po: 'Purchase Order' };

        <div><p class="lr-title">${item.name || '-'}</p><p class="lr-sub">${item.code || ''}</p></div>
        <p class="lr-amount tnum t-red">${fmtIDR(amt)}</p>
      </div>`;
    });
  }
  html += `</div>`;
  showDetailModal('Rincian Hutang', html);
}

// ==========================================
// INIT
// ==========================================
window.addEventListener('load', () => {
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
  const end = new Date(now.getFullYear(), now.getMonth() + 1, 0).toISOString().split('T')[0];
  currentFilter = { start, end };
  document.getElementById('filterStart').value = start;
  document.getElementById('filterEnd').value = end;
  updateHeader('Dashboard', getCurrentPeriodLabel());
  loadOverview();
});

// Pull to refresh -> bypass cache client DAN server untuk halaman aktif
let touchStartY = 0;
document.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; });
document.addEventListener('touchmove', e => {
  const scrollY = window.scrollY;
  if (scrollY === 0 && e.touches[0].clientY - touchStartY > 100) {
    forceRefreshFlag = true;
    delete cache[currentPageName === 'laporan' ? 'report' : currentPageName];
    navigate(currentPageName);
    toast('Data diperbarui');
  }
});
</script>
